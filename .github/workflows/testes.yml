# Roda a verificacao automatizada a cada envio ao GitHub.
#
# Publicar e' "git push": o GitHub Pages serve o que estiver na main,
# com ou sem teste passando. Este fluxo nao impede a publicacao, mas
# marca o commit com X vermelho e avisa por e-mail quando algo quebra —
# antes de alguem na loja encontrar o erro.
name: Testes

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: node testes/executar.js
        run: node testes/executar.js
