<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard de Vendas — Lojão da Construção</title>
<meta name="theme-color" content="#FFF200">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vendas">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23FFF200' stroke='%232B3990' stroke-width='4'/%3E%3Cpath d='M14 40 V28 L24 28 24 22 32 16 50 28 V40 Z' fill='none' stroke='%232B3990' stroke-width='4' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  /* Dashboard standalone (sem app-shared de propósito): replica o
     visual do Power BI — cards amarelos, barras azuis, condensada em
     caixa alta. Mobile-first: o uso principal é no celular. */
  :root{
    --amarelo:#FFF200; --azul:#0d8ee9; --azul-escuro:#2B3990;
    --vermelho:#D91F26; --preto:#111; --cinza:#666; --linha:#e3e3e3;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; background:#fff; color:var(--preto);
    font-family:'IBM Plex Sans', system-ui, sans-serif; font-size:14px; }
  h1,h2,.card-kpi .rotulo,.filtro-ano button,th{
    font-family:'Barlow Condensed', 'Arial Narrow', sans-serif;
    text-transform:uppercase; letter-spacing:.02em;
  }
  .wrap{ max-width:1280px; margin:0 auto; padding:10px 10px 48px; }

  /* ── Topo: logo + cards ── */
  .topo{ display:flex; gap:10px; align-items:stretch; flex-wrap:wrap; }
  .logo{ width:84px; flex:0 0 84px; align-self:center; }
  .logo svg{ display:block; width:100%; height:auto; }
  .cards{ flex:1; display:grid; grid-template-columns:repeat(2, 1fr); gap:8px; min-width:0; }
  @media (min-width:760px){ .cards{ grid-template-columns:repeat(4, 1fr); } }
  .card-kpi{ background:var(--amarelo); border:2.5px solid var(--preto); padding:8px 10px 10px; text-align:center; }
  .card-kpi .rotulo{ font-weight:800; font-size:15px; line-height:1.1; }
  .card-kpi .valor{ font-family:'Barlow Condensed', sans-serif; font-weight:800; font-size:clamp(20px, 6vw, 30px); line-height:1.15; white-space:nowrap; }
  @media (min-width:760px){ .card-kpi .rotulo{ font-size:17px; } .card-kpi .valor{ font-size:clamp(20px, 2.4vw, 32px); } }

  /* ── Filtros (sticky) ── */
  .filtros{ position:sticky; top:0; z-index:20; background:#fff; border-bottom:2px solid var(--preto);
    margin:10px -10px 12px; padding:8px 10px; display:flex; gap:8px; align-items:center;
    overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .filtro-ano{ display:flex; gap:4px; flex:0 0 auto; }
  .filtro-ano button{ min-height:44px; padding:0 16px; font-size:16px; font-weight:700; cursor:pointer;
    border:2px solid var(--preto); background:#fff; color:var(--preto); }
  .filtro-ano button[aria-pressed="true"]{ background:var(--preto); color:#fff; }
  .filtros select{ min-height:44px; padding:0 8px; font-size:14px; border:2px solid var(--preto);
    background:#fff; color:var(--preto); flex:0 0 auto; max-width:46vw; }

  /* ── Grade principal ── */
  .grade{ display:flex; flex-direction:column; gap:14px; }
  .bloco{ border:1px solid var(--linha); padding:10px; }
  .bloco h2{ margin:0 0 8px; font-size:17px; font-weight:800; text-align:center; color:#222; }
  .grafico-caixa{ position:relative; height:220px; }
  @media (min-width:960px){
    /* DUAS linhas com costura unica: tabela de categorias + participacao
       em cima, fornecedores + combo embaixo — os quatro blocos se
       encontram num cruzamento so' (alinhado, como no Power BI). */
    .grade{ display:grid; grid-template-columns:minmax(360px, 5fr) 7fr; gap:14px;
      grid-template-areas: "tabcat partcat" "tabforn combomes" "pizza cresc"; }
    .bloco.b-tabcat{ grid-area:tabcat; }
    .bloco.b-partcat{ grid-area:partcat; }
    .bloco.b-combomes{ grid-area:combomes; }
    .bloco.b-tabforn{ grid-area:tabforn; }
    .bloco.b-pizza{ grid-area:pizza; }
    .bloco.b-cresc{ grid-area:cresc; }
    .b-pizza .grafico-caixa, .b-cresc .grafico-caixa{ height:360px; }
    .grafico-caixa{ height:250px; }
    /* O combo preenche o bloco inteiro (a linha dele acompanha a
       altura da tabela de fornecedores) — sem faixa branca sobrando. */
    .bloco.b-combomes{ display:flex; flex-direction:column; }
    .b-combomes .grafico-caixa{ height:auto; flex:1; min-height:340px; }
  }
  /* Ordem de empilhamento no celular (pedida no layout) */
  .b-combomes{ order:1; } .b-partcat{ order:2; }
  .b-tabcat{ order:3; } .b-tabforn{ order:4; } .b-pizza{ order:5; } .b-cresc{ order:6; }
  .b-pizza .grafico-caixa, .b-cresc .grafico-caixa{ height:320px; }
  .mini-toggle{ display:flex; gap:4px; justify-content:center; margin-bottom:4px; }
  .mini-toggle button{ min-height:34px; padding:0 12px; font-family:'Barlow Condensed', sans-serif;
    font-size:13px; font-weight:700; text-transform:uppercase; cursor:pointer;
    border:2px solid var(--preto); background:#fff; color:var(--preto); }
  .mini-toggle button[aria-pressed="true"]{ background:var(--preto); color:#fff; }
  .sub-periodo{ display:block; text-align:center; font-size:12px; color:var(--cinza); margin-bottom:4px; }
  .b-combomes .grafico-caixa{ height:260px; }
  .b-combomes h2{ margin-bottom:0; } /* a legenda do gráfico cola no título */

  /* ── Tabelas ── */
  .rolagem{ overflow:auto; max-height:400px; }
  table{ width:100%; border-collapse:collapse; font-size:12.5px; min-width:340px; }
  th{ font-size:13px; font-weight:700; text-align:right; padding:6px 8px; border-bottom:2px solid var(--preto);
    cursor:pointer; user-select:none; position:sticky; top:0; background:#fff; white-space:nowrap; }
  th:first-child, td:first-child{ text-align:left; position:sticky; left:0; background:#fff; }
  td{ padding:5px 8px; border-bottom:1px solid var(--linha); text-align:right; white-space:nowrap;
    font-variant-numeric:tabular-nums; }
  tr.total td{ font-weight:700; border-top:2px solid var(--preto); background:#fff; }
  td.neg{ color:var(--vermelho); }
  /* Clique-filtra: linhas clicáveis, e a linha do filtro ativo fica
     marcada de amarelo (o mesmo gesto do Power BI). */
  tbody tr[data-filtro]{ cursor:pointer; }
  tbody tr[data-filtro]:hover td{ background:#f2f9ff; }
  tbody tr.ativa td{ background:var(--amarelo); font-weight:700; }
  .btn-limpar{ min-height:44px; padding:0 14px; font-size:14px; font-weight:700; cursor:pointer;
    border:2px solid var(--vermelho); background:#fff; color:var(--vermelho); flex:0 0 auto; }

  .estado{ text-align:center; padding:40px 16px; color:var(--cinza); font-size:15px; }
  .estado.erro{ color:var(--vermelho); font-weight:600; }
  .rodape{ margin-top:18px; text-align:center; color:var(--cinza); font-size:12px; }
  .rodape button{ min-height:44px; padding:0 14px; margin-left:8px; border:2px solid var(--preto);
    background:#fff; cursor:pointer; font-weight:600; }
</style>
</head>

<script>
(() => {
  'use strict';

  // ═══ CONFIGURAÇÃO ═════════════════════════════════════════════
  // ID da Google Sheet (compartilhada como "qualquer pessoa com o
  // link — leitor"), aba "dados" com as colunas: Ano, Mes,
  // Fornecedor, Categoria, Quantidade, Faturamento, LucroBruto.
  const SHEET_ID = '1i-BufQCqSfovPEwdGz8bzmhW07ZxQNqyX3TQjX4K3Ac';
  const URL_GVIZ = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID +
    '/gviz/tq?tqx=out:json&headers=1&sheet=dados';

  const MESES = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
  const MESES_CHEIOS = ['janeiro','fevereiro','março','abril','maio','junho',
    'julho','agosto','setembro','outubro','novembro','dezembro'];
  const AZUL = '#0d8ee9';
  const AZUL_FRACO = 'rgba(13,142,233,0.25)';

  // ═══ FUNÇÕES PURAS (as regras; os testes as extraem daqui) ═════

  // A resposta do gviz vem embrulhada em
  // google.visualization.Query.setResponse(...) — não é JSON puro.
  function parseGvizTexto(texto){
    const ini = texto.indexOf('(');
    const fim = texto.lastIndexOf(')');
    if(ini === -1 || fim === -1 || fim <= ini) throw new Error('Resposta do gviz fora do formato esperado.');
    return JSON.parse(texto.substring(ini + 1, fim));
  }

  // Converte a tabela do gviz em linhas {ano, mes, fornecedor,
  // categoria, quantidade, faturamento, lucro}. Casa as colunas pelo
  // RÓTULO (a ordem da planilha pode mudar); sem rótulos reconhecíveis
  // cai na ordem documentada. Linha sem ano/mês válidos é descartada.
  function linhasDaResposta(json){
    const cols = (json.table && json.table.cols) || [];
    const idx = { ano: 0, mes: 1, fornecedor: 2, categoria: 3, quantidade: 4, faturamento: 5, lucro: 6 };
    const mapa = { ano: 'ano', mes: 'mes', fornecedor: 'fornecedor', categoria: 'categoria',
      quantidade: 'quantidade', faturamento: 'faturamento', lucrobruto: 'lucro' };
    cols.forEach((c, i) => {
      const rot = String(c.label || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
      if(mapa[rot] != null) idx[mapa[rot]] = i;
    });
    const cel = (linha, i) => {
      const c = linha.c && linha.c[i];
      return c && c.v != null ? c.v : null;
    };
    const linhas = [];
    ((json.table && json.table.rows) || []).forEach(r => {
      const ano = Number(cel(r, idx.ano));
      const mes = Number(cel(r, idx.mes));
      if(!(ano >= 2000) || !(mes >= 1 && mes <= 12)) return;
      linhas.push({
        ano, mes,
        fornecedor: String(cel(r, idx.fornecedor) || '').trim(),
        categoria: String(cel(r, idx.categoria) || '').trim(),
        quantidade: Number(cel(r, idx.quantidade)) || 0,
        faturamento: Number(cel(r, idx.faturamento)) || 0,
        lucro: Number(cel(r, idx.lucro)) || 0
      });
    });
    return linhas;
  }

  function filtrarLinhas(linhas, f){
    return linhas.filter(l =>
      (!f.ano || l.ano === f.ano) &&
      (!f.mes || l.mes === f.mes) &&
      (!f.fornecedor || l.fornecedor === f.fornecedor) &&
      (!f.categoria || l.categoria === f.categoria));
  }

  // REGRA DE OURO: margem NUNCA é média de margens — sempre
  // soma(lucro) / soma(faturamento) do conjunto. Sem faturamento não
  // há margem (null, nunca 0%).
  function resumoKpis(linhas){
    let fat = 0, lucro = 0, itens = 0;
    linhas.forEach(l => { fat += l.faturamento; lucro += l.lucro; itens += l.quantidade; });
    return { faturamento: fat, lucro, itens, margem: fat > 0 ? lucro / fat : null };
  }

  // Agrupa por um campo (Categoria/Fornecedor): linhas ordenadas por
  // faturamento desc + a linha Total — margem de cada grupo pela
  // regra de ouro, nunca média.
  function agruparPor(linhas, campo){
    const grupos = new Map();
    linhas.forEach(l => {
      const chave = l[campo] || '(sem ' + campo + ')';
      const g = grupos.get(chave) || { nome: chave, faturamento: 0, lucro: 0 };
      g.faturamento += l.faturamento;
      g.lucro += l.lucro;
      grupos.set(chave, g);
    });
    const lista = [...grupos.values()].map(g => ({
      ...g, margem: g.faturamento > 0 ? g.lucro / g.faturamento : null
    })).sort((a, b) => b.faturamento - a.faturamento);
    const total = resumoKpis(linhas);
    return { lista, total };
  }

  // Séries mensais do ano (12 posições; mês sem dado = null, nunca
  // zero — zero seria uma afirmação).
  function seriesMensais(linhas){
    const fat = Array(12).fill(null);
    const lucro = Array(12).fill(null);
    linhas.forEach(l => {
      fat[l.mes - 1] = (fat[l.mes - 1] || 0) + l.faturamento;
      lucro[l.mes - 1] = (lucro[l.mes - 1] || 0) + l.lucro;
    });
    const margem = fat.map((v, i) => (v != null && v > 0) ? lucro[i] / v : null);
    return { faturamento: fat, margem };
  }

  // Participação por categoria: % do faturamento filtrado.
  function participacaoCategorias(linhas){
    const { lista, total } = agruparPor(linhas, 'categoria');
    if(!(total.faturamento > 0)) return [];
    return lista.map(g => ({ nome: g.nome, pct: g.faturamento / total.faturamento }));
  }

  // Market share: participação de cada fornecedor no faturamento do
  // conjunto. Só os topN maiores ganham fatia própria; o resto vira
  // uma fatia "Demais (N)" — pizza de 30 fatias não informa nada.
  function marketShareFornecedores(linhas, topN){
    const { lista, total } = agruparPor(linhas, 'fornecedor');
    if(!(total.faturamento > 0)) return [];
    const n = topN || 12;
    const fatias = lista.slice(0, n).map(g => ({
      nome: g.nome, faturamento: g.faturamento, pct: g.faturamento / total.faturamento }));
    const resto = lista.slice(n);
    const fatResto = resto.reduce((s, g) => s + g.faturamento, 0);
    if(fatResto > 0){
      fatias.push({ nome: 'Demais (' + resto.length + ')', faturamento: fatResto,
        pct: fatResto / total.faturamento, demais: true });
    }
    return fatias;
  }

  // Crescimento anual por categoria/fornecedor no PERÍODO COMPARÁVEL:
  // os meses considerados são os que o ano selecionado tem preenchidos
  // (com faturamento), comparados aos MESMOS meses do ano anterior —
  // nunca ano cheio contra ano parcial. Com um mês específico (mes),
  // compara mês × mesmo mês.
  //
  // Devolve { periodo: {de, ate, anoAnterior} | null, itens }, com
  // cada item { nome, atual, anterior, cresc, novo }:
  //   - cresc = atual/anterior − 1;
  //   - sem ano anterior naquele nome → novo:true e cresc null (nunca
  //     um % infinito);
  //   - quem zerou aparece com −100%;
  //   - sem NENHUM dado do ano anterior no período → periodo null (a
  //     tela avisa em vez de desenhar um gráfico vazio).
  function crescimentoAnual(linhas, ano, campo, mes){
    let mesesSet;
    if(mes){
      mesesSet = new Set([mes]);
    } else {
      mesesSet = new Set(linhas.filter(l => l.ano === ano && l.faturamento > 0).map(l => l.mes));
    }
    if(!mesesSet.size) return { periodo: null, itens: [] };
    const meses = [...mesesSet].sort((a, b) => a - b);

    const atualPor = new Map(), antPor = new Map();
    const soma = (mapa, l) => mapa.set(l[campo] || '', (mapa.get(l[campo] || '') || 0) + l.faturamento);
    linhas.forEach(l => {
      if(!mesesSet.has(l.mes)) return;
      if(l.ano === ano) soma(atualPor, l);
      else if(l.ano === ano - 1) soma(antPor, l);
    });
    if(![...antPor.values()].some(v => v > 0)) return { periodo: null, itens: [] };

    const nomes = new Set([...atualPor.keys(), ...antPor.keys()]);
    const itens = [...nomes].map(nome => {
      const atual = atualPor.get(nome) || 0;
      const anterior = antPor.get(nome) || 0;
      if(!(atual > 0) && !(anterior > 0)) return null;
      return { nome, atual, anterior,
        novo: !(anterior > 0),
        cresc: anterior > 0 ? atual / anterior - 1 : null };
    }).filter(Boolean).sort((a, b) => {
      const ca = a.novo ? Infinity : a.cresc;
      const cb = b.novo ? Infinity : b.cresc;
      return cb - ca || b.atual - a.atual;
    });
    return { periodo: { de: meses[0], ate: meses[meses.length - 1], anoAnterior: ano - 1 }, itens };
  }

  // ═══ FORMATAÇÃO pt-BR ═════════════════════════════════════════
  const fmtNum = (v, casas = 2) => v == null ? '—'
    : v.toLocaleString('pt-BR', { minimumFractionDigits: casas, maximumFractionDigits: casas });
  const fmtPct = (v) => v == null ? '—' : (v * 100).toLocaleString('pt-BR',
    { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + '%';
  // "6,71 M": duas casas (pedido de 03/09/2026) e o sufixo curto para
  // o rótulo não ficar apertado entre as barras.
  const fmtMi = (v) => v == null ? '' : (v / 1e6).toLocaleString('pt-BR',
    { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' M';
  const escapeHtml = (s) => String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');

  // ═══ ESTADO E RENDER ══════════════════════════════════════════
  let linhasTodas = [];
  let anoSel = null, mesSel = 0, fornSel = '', catSel = '';
  let ordem = { categoria: { campo: 'faturamento', desc: true },
                fornecedor: { campo: 'faturamento', desc: true } };
  const charts = {};
  const $ = (id) => document.getElementById(id);

  // Rótulos desenhados em cima das barras (plugin próprio: a única
  // biblioteca permitida é o Chart.js).
  // Rotula todos os datasets: `formatadores[i]` por dataset (o combo
  // tem barra E linha), ou `formatar` para o caso simples. Cada
  // formatador pode trazer a cor do texto em `cor`.
  const rotulosBarras = {
    id: 'rotulosBarras',
    afterDatasetsDraw(chart, args, opts){
      const ctx = chart.ctx;
      ctx.save();
      // 14px em negrito: a 11px condensada os rotulos ficavam pequenos
      // e "borrados" no celular.
      ctx.font = opts.fonte || '700 14px "Barlow Condensed", sans-serif';
      chart.data.datasets.forEach((ds, di) => {
        const conf = (opts.formatadores && opts.formatadores[di]) ||
          (di === 0 && opts.formatar ? { formatar: opts.formatar } : null);
        if(!conf) return;
        const meta = chart.getDatasetMeta(di);
        ctx.fillStyle = conf.cor || '#111';
        meta.data.forEach((el, i) => {
          const txt = conf.formatar ? conf.formatar(ds.data[i], i) : '';
          if(!txt) return;
          if(chart.options.indexAxis === 'y'){
            ctx.textBaseline = 'middle';
            const neg = typeof ds.data[i] === 'number' && ds.data[i] < 0;
            if(!neg){
              ctx.textAlign = 'left';
              ctx.fillText(txt, el.x + 5, el.y);
            } else {
              // Barra negativa: o rotulo MEDE onde cabe — fora da ponta
              // esquerda; senao DENTRO da barra (branco); senao a
              // direita do zero. No celular a folga fixa nao bastava e
              // os numeros caiam por cima dos nomes.
              const textW = ctx.measureText(txt).width;
              if(el.x - 6 - textW >= chart.chartArea.left){
                ctx.textAlign = 'right';
                ctx.fillText(txt, el.x - 5, el.y);
              } else if((el.base - el.x) >= textW + 12){
                const cor = ctx.fillStyle;
                ctx.textAlign = 'right'; ctx.fillStyle = '#fff';
                ctx.fillText(txt, el.base - 6, el.y);
                ctx.fillStyle = cor;
              } else {
                ctx.textAlign = 'left';
                ctx.fillText(txt, el.base + 5, el.y);
              }
            }
          } else {
            ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
            ctx.fillText(txt, el.x, el.y - (ds.type === 'line' ? 7 : 3));
          }
        });
      });
      ctx.restore();
    }
  };

  function filtrosSemMes(){ return { ano: anoSel, fornecedor: fornSel, categoria: catSel }; }
  function filtrosCompletos(){ return { ano: anoSel, mes: mesSel || null, fornecedor: fornSel, categoria: catSel }; }

  // Clique-filtra (tabelas e barras), sempre em TOGGLE: clicar de novo
  // remove o filtro. Os selects ficam sincronizados com o clique, e o
  // botão "✕ Limpar" aparece quando há filtro ativo.
  function sincronizarFiltrosUi(){
    $('filtroMes').value = String(mesSel || 0);
    $('filtroForn').value = fornSel;
    $('filtroCat').value = catSel;
    $('limparFiltrosBtn').style.display = (mesSel || fornSel || catSel) ? '' : 'none';
  }
  function alternarCategoria(nome){ catSel = catSel === nome ? '' : nome; sincronizarFiltrosUi(); renderTudo(); }
  function alternarFornecedor(nome){ fornSel = fornSel === nome ? '' : nome; sincronizarFiltrosUi(); renderTudo(); }
  function alternarMes(m){ mesSel = mesSel === m ? 0 : m; sincronizarFiltrosUi(); renderTudo(); }
  const cursorDeBarra = (ev, els) => { ev.native.target.style.cursor = els.length ? 'pointer' : 'default'; };

  function renderTudo(){
    const filtradas = filtrarLinhas(linhasTodas, filtrosCompletos());
    const k = resumoKpis(filtradas);
    $('kpiFat').textContent = fmtNum(k.faturamento);
    $('kpiLucro').textContent = fmtNum(k.lucro);
    $('kpiMargem').textContent = fmtPct(k.margem);
    $('kpiItens').textContent = fmtNum(k.itens);

    renderTabela('tabelaCategoria', agruparPor(filtradas, 'categoria'), 'categoria', 'Categoria');
    renderTabela('tabelaFornecedor', agruparPor(filtradas, 'fornecedor'), 'fornecedor', 'Fornecedor');
    renderPartCat(filtradas);
    renderMensais();
    renderPizzaFornecedores();
    renderCrescimentoAnual();
  }

  let crescVisao = 'categoria';

  function renderCrescimentoAnual(){
    // Respeita categoria/fornecedor filtrados; o ANO define o par
    // (2026 × 2025) e o mês filtrado muda a pergunta: julho × julho.
    const base = filtrarLinhas(linhasTodas, { fornecedor: fornSel, categoria: catSel });
    const r = crescimentoAnual(base, anoSel, crescVisao, mesSel || null);
    const vazio = $('crescVazio');
    const caixa = $('gCrescAnual').parentElement;

    if(!r.periodo){
      caixa.style.display = 'none';
      vazio.style.display = '';
      vazio.textContent = 'Sem dados de ' + (anoSel - 1) + ' no período para comparar.';
      $('crescPeriodo').textContent = '';
      if(charts.gCrescAnual){ charts.gCrescAnual.destroy(); delete charts.gCrescAnual; }
      return;
    }
    caixa.style.display = '';
    vazio.style.display = 'none';
    $('crescPeriodo').textContent = (r.periodo.de === r.periodo.ate
      ? MESES[r.periodo.de - 1] + ' ' + anoSel + ' × ' + MESES[r.periodo.de - 1] + ' ' + r.periodo.anoAnterior
      : MESES[r.periodo.de - 1] + '–' + MESES[r.periodo.ate - 1] + ' ' + anoSel +
        ' × ' + MESES[r.periodo.de - 1] + '–' + MESES[r.periodo.ate - 1] + ' ' + r.periodo.anoAnterior) +
      (crescVisao === 'fornecedor' ? ' · 12 maiores' : '');

    // Fornecedor: só os 12 maiores do período (30 barras é confete).
    let itens = r.itens;
    if(crescVisao === 'fornecedor' && itens.length > 12){
      itens = itens.slice().sort((a, b) => b.atual - a.atual).slice(0, 12)
        .sort((a, b) => ((b.novo ? Infinity : b.cresc) - (a.novo ? Infinity : a.cresc)) || b.atual - a.atual);
    }

    // A BARRA é limitada a ±100%; o rótulo mostra o % verdadeiro. Sem
    // o teto, um outlier (+2.388% num mês) esticava a escala inteira,
    // as quedas viravam um fio no canto e os rótulos delas caíam por
    // cima dos nomes (bug de 03/09/2026). "Novo" entra um degrau
    // acima do teto, com o rótulo "novo".
    const TETO_BARRA = 1;
    const valores = itens.map(i => i.novo
      ? TETO_BARRA * 1.12
      : Math.max(-TETO_BARRA, Math.min(TETO_BARRA, i.cresc)));
    const cores = itens.map(i => i.novo ? '#0d8ee9' : (i.cresc >= 0 ? '#2E9E5B' : '#D91F26'));

    novoChart('gCrescAnual', {
      type: 'bar',
      data: { labels: itens.map(i => i.nome),
        datasets: [{ data: valores, backgroundColor: cores, maxBarThickness: 24 }] },
      options: {
        indexAxis: 'y', responsive: true, maintainAspectRatio: false,
        // Folga só à direita (altas); as quedas usam o posicionamento
        // inteligente do plugin — a folga fixa à esquerda roubava
        // largura útil no celular e ainda assim estourava.
        layout: { padding: { right: 78, left: 8 } },
        onClick: (ev, els) => {
          if(!els.length) return;
          const it = itens[els[0].index];
          if(it) (crescVisao === 'categoria' ? alternarCategoria : alternarFornecedor)(it.nome);
        },
        onHover: cursorDeBarra,
        plugins: { legend: { display: false }, tooltip: { enabled: false },
          rotulosBarras: { fonte: '700 13px "Barlow Condensed", sans-serif',
            formatar: (v, i) => {
              const it = itens[i];
              if(!it) return '';
              if(it.novo) return 'novo';
              return (it.cresc >= 0 ? '+' : '') + fmtPct(it.cresc);
            } } },
        scales: {
          x: { display: false,
            min: Math.min(-0.1, ...valores) * 1.15,
            max: Math.max(0.1, ...valores) * 1.15 },
          y: { grid: { display: false }, ticks: { font: { size: 12 } } }
        }
      },
      plugins: [rotulosBarras]
    });
  }

  // Paleta fixa das fatias; a "Demais" é sempre cinza.
  const CORES_PIZZA = ['#0d8ee9', '#2B3990', '#FFD400', '#D91F26', '#2E9E5B', '#F28C28',
    '#7B4FD1', '#00A6A6', '#8A6414', '#E85D9B', '#94D13D', '#5C7A99'];

  function renderPizzaFornecedores(){
    // Respeita ano/mês/categoria mas IGNORA o filtro de fornecedor —
    // uma pizza 100% do fornecedor filtrado não diz nada; em vez
    // disso, a fatia dele acende e as demais esmaecem.
    const fatias = marketShareFornecedores(
      filtrarLinhas(linhasTodas, { ano: anoSel, mes: mesSel || null, categoria: catSel }));
    const corDe = (f, i) => f.demais ? '#b9b9b9' : CORES_PIZZA[i % CORES_PIZZA.length];
    const cores = fatias.map((f, i) => {
      const cor = corDe(f, i);
      if(!fornSel || f.nome === fornSel) return cor;
      return cor + '40'; // esmaecida (40 = ~25% de opacidade em hex)
    });
    const rotulosPizza = {
      id: 'rotulosPizza',
      afterDatasetsDraw(chart){
        const ctx = chart.ctx;
        const meta = chart.getDatasetMeta(0);
        ctx.save();
        ctx.font = '700 13px "Barlow Condensed", sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        meta.data.forEach((arco, i) => {
          const f = fatias[i];
          if(!f || f.pct < 0.035) return; // fatia fina não comporta texto
          const p = arco.tooltipPosition();
          ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,0.45)';
          ctx.strokeText(fmtPct(f.pct), p.x, p.y);
          ctx.fillStyle = '#fff';
          ctx.fillText(fmtPct(f.pct), p.x, p.y);
        });
        ctx.restore();
      }
    };
    novoChart('gPizzaForn', {
      type: 'pie',
      data: { labels: fatias.map(f => f.nome),
        datasets: [{ data: fatias.map(f => f.pct), backgroundColor: cores, borderColor: '#fff', borderWidth: 1.5 }] },
      options: {
        responsive: true, maintainAspectRatio: false,
        onClick: (ev, els) => {
          if(!els.length) return;
          const f = fatias[els[0].index];
          if(f && !f.demais) alternarFornecedor(f.nome);
        },
        onHover: cursorDeBarra,
        plugins: {
          legend: { display: true, position: window.innerWidth >= 760 ? 'right' : 'bottom',
            labels: { boxWidth: 12, boxHeight: 12, padding: 8,
              font: { family: "'Barlow Condensed', sans-serif", size: 12, weight: 700 } } },
          tooltip: { enabled: false }
        }
      },
      plugins: [rotulosPizza]
    });
  }

  function renderTabela(alvoId, dados, chaveOrdem, rotulo){
    const o = ordem[chaveOrdem];
    const lista = dados.lista.slice().sort((a, b) => {
      const va = a[o.campo], vb = b[o.campo];
      if(typeof va === 'string') return (o.desc ? -1 : 1) * va.localeCompare(vb, 'pt-BR');
      return (o.desc ? -1 : 1) * (((va == null ? -Infinity : va)) - ((vb == null ? -Infinity : vb)));
    });
    const seta = (campo) => o.campo === campo ? (o.desc ? ' ▼' : ' ▲') : '';
    let html = '<table><thead><tr>' +
      '<th data-ord="nome">' + rotulo + seta('nome') + '</th>' +
      '<th data-ord="faturamento">Faturamento' + seta('faturamento') + '</th>' +
      '<th data-ord="lucro">Lucro bruto' + seta('lucro') + '</th>' +
      '<th data-ord="margem">Margem' + seta('margem') + '</th></tr></thead><tbody>';
    const filtroAtual = chaveOrdem === 'categoria' ? catSel : fornSel;
    lista.forEach(g => {
      html += '<tr data-filtro="' + escapeHtml(g.nome) + '"' +
        (g.nome === filtroAtual ? ' class="ativa"' : '') +
        ' title="Clique para filtrar por ' + escapeHtml(g.nome) + ' (clique de novo para limpar)">' +
        '<td>' + escapeHtml(g.nome) + '</td>' +
        '<td>' + fmtNum(g.faturamento) + '</td>' +
        '<td class="' + (g.lucro < 0 ? 'neg' : '') + '">' + fmtNum(g.lucro) + '</td>' +
        '<td class="' + (g.margem != null && g.margem < 0 ? 'neg' : '') + '">' + fmtPct(g.margem) + '</td></tr>';
    });
    html += '<tr class="total"><td>Total</td><td>' + fmtNum(dados.total.faturamento) + '</td>' +
      '<td>' + fmtNum(dados.total.lucro) + '</td><td>' + fmtPct(dados.total.margem) + '</td></tr>';
    $(alvoId).innerHTML = html + '</tbody></table>';
    $(alvoId).querySelectorAll('th[data-ord]').forEach(th => {
      th.addEventListener('click', () => {
        const campo = th.dataset.ord;
        if(o.campo === campo) o.desc = !o.desc;
        else { o.campo = campo; o.desc = campo !== 'nome'; }
        renderTabela(alvoId, dados, chaveOrdem, rotulo);
      });
    });
    $(alvoId).querySelectorAll('tr[data-filtro]').forEach(tr => {
      tr.addEventListener('click', () =>
        (chaveOrdem === 'categoria' ? alternarCategoria : alternarFornecedor)(tr.dataset.filtro));
    });
  }

  function novoChart(id, config){
    if(charts[id]) charts[id].destroy();
    charts[id] = new Chart($(id), config);
  }

  function renderPartCat(filtradas){
    const parte = participacaoCategorias(filtradas);
    novoChart('gPartCat', {
      type: 'bar',
      data: { labels: parte.map(p => p.nome),
        datasets: [{ data: parte.map(p => p.pct), backgroundColor: AZUL, maxBarThickness: 26 }] },
      options: {
        indexAxis: 'y', responsive: true, maintainAspectRatio: false,
        layout: { padding: { right: 64 } },
        onClick: (ev, els) => { if(els.length && parte[els[0].index]) alternarCategoria(parte[els[0].index].nome); },
        onHover: cursorDeBarra,
        plugins: { legend: { display: false }, tooltip: { enabled: false },
          rotulosBarras: { formatar: v => fmtPct(v), fonte: '700 13px "Barlow Condensed", sans-serif' } },
        scales: { x: { display: false, max: Math.max(0.1, ...parte.map(p => p.pct)) * 1.15 },
          y: { grid: { display: false }, ticks: { font: { size: 13 } } } }
      },
      plugins: [rotulosBarras]
    });
  }

  function renderMensais(){
    // Combo num gráfico só (pedido de 03/09/2026): FATURAMENTO em
    // barras (grandeza em R$) e MARGEM em linha (taxa em %) — a
    // convenção financeira; eixos separados e escondidos, com a linha
    // ancorada na faixa de cima para os rótulos não brigarem com os
    // das barras. Respeita ano/fornecedor/categoria mas NÃO o mês:
    // mês filtrado acende a barra e esmaece as demais.
    const s = seriesMensais(filtrarLinhas(linhasTodas, filtrosSemMes()));
    const cores = MESES.map((_, i) => (!mesSel || mesSel === i + 1) ? AZUL : AZUL_FRACO);
    const maxFat = Math.max(1, ...s.faturamento.map(v => v || 0));
    const margens = s.margem.filter(v => v != null);
    const maxMarg = margens.length ? Math.max(...margens) : 0.01;
    const minMarg = margens.length ? Math.min(0, ...margens) : 0;
    novoChart('gComboMes', {
      data: {
        labels: MESES,
        datasets: [
          { type: 'line', label: 'Margem (%)', data: s.margem, yAxisID: 'yMargem',
            borderColor: '#2B3990', backgroundColor: '#2B3990', borderWidth: 2.5,
            pointRadius: 3.5, pointHoverRadius: 4, spanGaps: false, tension: 0.15 },
          { type: 'bar', label: 'Faturamento (R$)', data: s.faturamento, yAxisID: 'yFat',
            backgroundColor: cores, maxBarThickness: 48 }
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        layout: { padding: { top: 0 } },
        // Clicar num mês (barra ou ponto) filtra por ele; de novo, limpa.
        onClick: (ev, els) => { if(els.length) alternarMes(els[0].index + 1); },
        onHover: cursorDeBarra,
        plugins: {
          // Legenda pequena e colada no título; a linha da margem fica
          // ancorada mais para baixo (escala) para não encostar nela.
          legend: { display: true, position: 'top', align: 'center',
            labels: { boxWidth: 10, boxHeight: 10, padding: 6,
              font: { family: "'Barlow Condensed', sans-serif", size: 11, weight: 700 } } },
          tooltip: { enabled: false },
          rotulosBarras: { formatadores: [
            { formatar: v => v == null ? '' : fmtPct(v), cor: '#2B3990' },
            { formatar: v => v == null ? '' : fmtMi(v) }
          ] }
        },
        scales: {
          // Barras nos ~48% de baixo; a linha vive na faixa de cima com
          // a escala JUSTA na variação da margem — a amplitude dos
          // dados ocupa ~40% da altura, então 3 pontos de queda viram
          // uma descida visível, não uma linha "constante" (pedido de
          // 03/09/2026, caso Karina: 16,96% -> 13,68%).
          yFat: { display: false, beginAtZero: true, suggestedMax: maxFat * 2.1 },
          yMargem: (() => {
            const faixa = Math.max(maxMarg - minMarg, 0.004); // piso: 1 mês só não explode a escala
            return { display: false, min: minMarg - faixa * 1.3, max: maxMarg + faixa * 0.25 };
          })(),
          x: { grid: { display: false }, ticks: { font: { size: 12 } } }
        }
      },
      plugins: [rotulosBarras]
    });
  }

  // ═══ FILTROS ══════════════════════════════════════════════════
  function montarFiltros(){
    const anos = [...new Set(linhasTodas.map(l => l.ano))].sort();
    if(anoSel == null || !anos.includes(anoSel)) anoSel = anos[anos.length - 1] || null;
    $('filtroAno').innerHTML = anos.map(a =>
      '<button type="button" data-ano="' + a + '" aria-pressed="' + (a === anoSel) + '">' + a + '</button>').join('');
    $('filtroAno').querySelectorAll('button').forEach(b =>
      b.addEventListener('click', () => { anoSel = Number(b.dataset.ano); montarFiltros(); renderTudo(); }));

    $('filtroMes').innerHTML = '<option value="0">Todos os meses</option>' +
      MESES_CHEIOS.map((m, i) => '<option value="' + (i + 1) + '"' + (mesSel === i + 1 ? ' selected' : '') + '>' + m + '</option>').join('');
    const fornecedores = [...new Set(linhasTodas.map(l => l.fornecedor).filter(Boolean))]
      .sort((a, b) => a.localeCompare(b, 'pt-BR'));
    $('filtroForn').innerHTML = '<option value="">Todos os fornecedores</option>' +
      fornecedores.map(f => '<option' + (fornSel === f ? ' selected' : '') + '>' + escapeHtml(f) + '</option>').join('');
    const categorias = [...new Set(linhasTodas.map(l => l.categoria).filter(Boolean))]
      .sort((a, b) => a.localeCompare(b, 'pt-BR'));
    $('filtroCat').innerHTML = '<option value="">Todas as categorias</option>' +
      categorias.map(c => '<option' + (catSel === c ? ' selected' : '') + '>' + escapeHtml(c) + '</option>').join('');
  }

  // ═══ CARGA ════════════════════════════════════════════════════
  async function carregarDados(){
    $('estadoCarga').style.display = '';
    $('estadoCarga').className = 'estado';
    $('estadoCarga').textContent = 'Carregando dados da planilha...';
    $('conteudoDash').style.display = 'none';
    $('rodapeDash').style.display = 'none';
    try{
      const resp = await fetch(URL_GVIZ);
      if(!resp.ok) throw new Error('HTTP ' + resp.status);
      const texto = await resp.text();
      linhasTodas = linhasDaResposta(parseGvizTexto(texto));
      if(!linhasTodas.length) throw new Error('A aba "dados" veio vazia.');
      montarFiltros();
      $('estadoCarga').style.display = 'none';
      $('conteudoDash').style.display = '';
      $('rodapeDash').style.display = '';
      $('rodapeInfo').textContent = 'Dados atualizados da planilha em ' +
        new Date().toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' }) + '.';
      renderTudo();
    }catch(e){
      console.error(e);
      $('estadoCarga').className = 'estado erro';
      $('estadoCarga').textContent = 'Não consegui ler a planilha (' + (e.message || e) + '). ' +
        'Confira se a Sheet está compartilhada como "qualquer pessoa com o link — leitor", ' +
        'se a aba se chama "dados" e se o SHEET_ID no topo do arquivo está certo. ' +
        'Depois toque em Recarregar.';
      $('rodapeDash').style.display = '';
    }
  }

  function iniciar(){
    $('filtroMes').addEventListener('change', function(){ mesSel = Number(this.value) || 0; sincronizarFiltrosUi(); renderTudo(); });
    $('filtroForn').addEventListener('change', function(){ fornSel = this.value; sincronizarFiltrosUi(); renderTudo(); });
    $('filtroCat').addEventListener('change', function(){ catSel = this.value; sincronizarFiltrosUi(); renderTudo(); });
    $('limparFiltrosBtn').addEventListener('click', function(){
      mesSel = 0; fornSel = ''; catSel = '';
      sincronizarFiltrosUi(); renderTudo();
    });
    document.querySelectorAll('.mini-toggle button').forEach(b =>
      b.addEventListener('click', () => {
        crescVisao = b.dataset.visao;
        document.querySelectorAll('.mini-toggle button').forEach(x =>
          x.setAttribute('aria-pressed', String(x === b)));
        renderCrescimentoAnual();
      }));
    $('recarregarDadosBtn').addEventListener('click', carregarDados);
    carregarDados();
  }

  // No navegador de verdade, liga tudo; no DOM simulado dos testes
  // (sem fetch/Chart), só as funções puras interessam.
  if(typeof fetch === 'function' && typeof Chart !== 'undefined') iniciar();
})();
</script>
</body>
